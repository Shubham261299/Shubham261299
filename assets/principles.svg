<g transform="translate(0.0,0)"><rect x=".5" y=".5" width="189.4" height="131" rx="13" fill="#0b1020" stroke="#1b2548"/><rect x="14" y="14" width="30" height="24" rx="7" fill="#0e1530" stroke="#1b2548"/><text x="29" y="30" font-size="10.5" fill="#5b8cff" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">01</text><text x="14" y="62" font-size="13.5" fill="#e8ecf8" font-weight="700" text-anchor="start">Ground the model</text><text x="14" y="82" font-size="11" fill="#8b95b5" font-weight="400" text-anchor="start">Facts before generation.</text></g><g transform="translate(202.4,0)"><rect x=".5" y=".5" width="189.4" height="131" rx="13" fill="#0b1020" stroke="#1b2548"/><rect x="14" y="14" width="30" height="24" rx="7" fill="#0e1530" stroke="#1b2548"/><text x="29" y="30" font-size="10.5" fill="#5b8cff" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">02</text><text x="14" y="62" font-size="13.5" fill="#e8ecf8" font-weight="700" text-anchor="start">Give agents tools</text><text x="14" y="82" font-size="11" fill="#8b95b5" font-weight="400" text-anchor="start">Intelligence becomes</text><text x="14" y="97" font-size="11" fill="#8b95b5" font-weight="400" text-anchor="start">useful when it can</text><text x="14" y="112" font-size="11" fill="#8b95b5" font-weight="400" text-anchor="start">interact.</text></g><g transform="translate(404.8,0)"><rect x=".5" y=".5" width="189.4" height="131" rx="13" fill="#0b1020" stroke="#1b2548"/><rect x="14" y="14" width="30" height="24" rx="7" fill="#0e1530" stroke="#1b2548"/><text x="29" y="30" font-size="10.5" fill="#5b8cff" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">03</text><text x="14" y="62" font-size="13.5" fill="#e8ecf8" font-weight="700" text-anchor="start">Keep humans in control</text><text x="14" y="82" font-size="11" fill="#8b95b5" font-weight="400" text-anchor="start">Automation ≠ removing</text><text x="14" y="97" font-size="11" fill="#8b95b5" font-weight="400" text-anchor="start">accountability.</text></g><g transform="translate(607.2,0)"><rect x=".5" y=".5" width="189.4" height="131" rx="13" fill="#0b1020" stroke="#1b2548"/><rect x="14" y="14" width="30" height="24" rx="7" fill="#0e1530" stroke="#1b2548"/><text x="29" y="30" font-size="10.5" fill="#5b8cff" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">04</text><text x="14" y="62" font-size="13.5" fill="#e8ecf8" font-weight="700" text-anchor="start">Make state durable</text><text x="14" y="82" font-size="11" fill="#8b95b5" font-weight="400" text-anchor="start">Agents should survive</text><text x="14" y="97" font-size="11" fill="#8b95b5" font-weight="400" text-anchor="start">failures.</text></g><g transform="translate(809.6,0)"><rect x=".5" y=".5" width="189.4" height="131" rx="13" fill="#0b1020" stroke="#1b2548"/><rect x="14" y="14" width="30" height="24" rx="7" fill="#0e1530" stroke="#1b2548"/><text x="29" y="30" font-size="10.5" fill="#5b8cff" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">05</text><text x="14" y="62" font-size="13.5" fill="#e8ecf8" font-weight="700" text-anchor="start">Measure the system</text><text x="14" y="82" font-size="11" fill="#8b95b5" font-weight="400" text-anchor="start">Evaluation &gt; vibes.</text></g>
